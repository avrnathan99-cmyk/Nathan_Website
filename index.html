<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nathan Abraham Technologies</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 50% 100%, rgba(27, 74, 105, 0.45), transparent 38%),
        linear-gradient(180deg, #02060b 0%, #07111a 55%, #06111a 100%);
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      padding: 8vh 24px 5vh;
    }

    /* subtle technical grid */
    .grid {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -15%;
      height: 55%;
      opacity: 0.17;
      background-image:
        linear-gradient(rgba(119, 193, 224, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(119, 193, 224, 0.35) 1px, transparent 1px);
      background-size: 70px 70px;
      transform: perspective(500px) rotateX(63deg);
      transform-origin: center bottom;
      mask-image: linear-gradient(to bottom, transparent, black 35%);
    }

    .monogram {
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-size: 21px;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    .name {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 0.18em;
      margin-left: 0.18em;
    }

    .technologies {
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: 0.55em;
      margin-left: 0.55em;
      color: #b5c2cb;
    }

    .tagline {
      margin-top: 30px;
      font-size: 12px;
      letter-spacing: 0.22em;
      color: #8fa0ad;
    }

    .divider {
      width: 55px;
      height: 1px;
      background: #b9a27b;
      margin: 38px 0 34px;
    }

    .message {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(27px, 4vw, 45px);
      letter-spacing: 0.02em;
    }

    .coming {
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 0.4em;
      color: #b8c2c8;
    }

    .contact {
      margin-top: auto;
      position: relative;
      z-index: 2;
    }

    .contact-label {
      font-size: 10px;
      letter-spacing: 0.35em;
      color: #81909b;
      margin-bottom: 12px;
    }

    .email {
      color: #ffffff;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      letter-spacing: 0.08em;
      transition: opacity 0.25s ease;
    }

    .email:hover {
      opacity: 0.65;
    }

    .footer {
      margin-top: 28px;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: #52616c;
    }

    @media (max-width: 600px) {
      .page {
        padding-top: 7vh;
      }

      .name {
        font-size: 27px;
        letter-spacing: 0.12em;
      }

      .technologies {
        letter-spacing: 0.4em;
      }

      .tagline {
        line-height: 1.8;
      }

      .message {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="grid"></div>

    <div class="monogram">NA</div>

    <h1 class="name">NATHAN ABRAHAM</h1>
    <div class="technologies">TECHNOLOGIES</div>

    <div class="tagline">
      INNOVATION &nbsp;·&nbsp; AI &nbsp;·&nbsp; AUTONOMOUS SYSTEMS
    </div>

    <div class="divider"></div>

    <h2 class="message">Something new is taking shape.</h2>
    <div class="coming">WEBSITE COMING SOON</div>

    <div class="contact">
      <div class="contact-label">GET IN TOUCH</div>

      <a class="email" href="mailto:nathan@nathan-abraham.com">
        nathan@nathan-abraham.com
      </a>

      <div class="footer">
        © 2026 NATHAN ABRAHAM TECHNOLOGIES
      </div>
    </div>

  </main>

</body>
</html>
